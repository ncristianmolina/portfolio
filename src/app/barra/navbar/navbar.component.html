<header>

    <ul id="navigation" [class.open]="isMenuOpen">
      <li><a routerLink="/" fragment="experiencia" (click)="isMenuOpen = false">Experiencia</a></li>
      <li><a routerLink="/" fragment="projects" (click)="isMenuOpen = false">Proyectos</a></li>
      <li><a routerLink="/" fragment="aboutme" (click)="isMenuOpen = false">Sobre mí</a></li>
      <li><a routerLink="/" fragment="education" (click)="isMenuOpen = false">Educación</a></li>
      <li><a class="nav-contact" routerLink="/" fragment="contacto" (click)="isMenuOpen = false">Hablemos <span aria-hidden="true">↗</span></a></li>
    </ul>
  </nav>
</header>
